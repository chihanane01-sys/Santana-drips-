<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <style>
    :root{--primary:#4f46e5;--dark:#3730a3;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--card:#fff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;color:var(--text)}
    .app{width:100%;max-width:700px;background:var(--card);border-radius:18px;box-shadow:0 10px 25px #1f293714;padding:32px 24px}
    h1{text-align:center;margin-bottom:8px;font-size:2rem}
    .creator{text-align:center;color:var(--muted);margin-bottom:24px;font-size:.95rem}
    .creator a{color:#2563eb;font-weight:700;text-decoration:none}
    .contact-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
    .contact-btn{display:flex;justify-content:center;align-items:center;min-height:48px;padding:12px;border-radius:10px;color:#fff;font-weight:700;text-decoration:none;text-align:center}
    .payment-btn{background:#059669}.official-btn{background:#2563eb}.contact-btn:hover{filter:brightness(.92)}
    .todo-form{display:flex;gap:12px;margin-bottom:20px}.todo-form input{flex:1;padding:14px 16px;border:1px solid var(--border);border-radius:12px;font-size:1rem;outline:none}.todo-form input:focus{border-color:var(--primary)}
    button{border:0;border-radius:10px;cursor:pointer;font-weight:600}.todo-form button{background:var(--primary);color:#fff;padding:0 18px;min-width:120px}.todo-form button:hover{background:var(--dark)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter-btn{background:#eef2ff;color:var(--dark);padding:8px 12px}.filter-btn.active{background:var(--primary);color:#fff}.clear-btn{background:#fff7ed;color:#d97706;padding:8px 12px}
    .stats{margin-bottom:14px;color:var(--muted);font-size:.95rem}.todo-list{list-style:none;display:flex;flex-direction:column;gap:10px}.task-item{background:#f9fafb;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}.task-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0}.task-checkbox{width:20px;height:20px;accent-color:#10b981}.task-text{flex:1;word-break:break-word}.completed .task-text{text-decoration:line-through;color:var(--muted)}.task-actions{display:flex;gap:8px}.edit-btn{background:#dbeafe;color:#1d4ed8;padding:8px 10px}.delete-btn{background:#fee2e2;color:#ef4444;padding:8px 10px}.empty-message{text-align:center;color:var(--muted);margin-top:18px}.hidden{display:none}
    @media(max-width:600px){.app{padding:24px 18px}.contact-buttons{grid-template-columns:1fr}.todo-form{flex-direction:column}.todo-form button{min-height:48px;width:100%}.toolbar{align-items:flex-start;flex-direction:column}.clear-btn{width:100%}.task-item{align-items:flex-start;flex-direction:column}.task-actions{width:100%;justify-content:flex-end}}
  </style>
</head>
<body>
  <main class="app">
    <h1>Lista de Tarefas</h1>
    <p class="creator">Criado por <strong>Mr James Chihanane</strong> — <a href="https://wa.me/27731233343" target="_blank" rel="noopener noreferrer">+27 73 123 3343</a></p>

    <div class="contact-buttons" aria-label="Contactos">
      <a class="contact-btn payment-btn" href="https://wa.me/258859613672?text=Ol%C3%A1%2C%20quero%20saber%20como%20efetuar%20o%20pagamento." target="_blank" rel="noopener noreferrer">💳 Pagar agora</a>
      <a class="contact-btn official-btn" href="https://wa.me/27837835874?text=Ol%C3%A1%2C%20quero%20falar%20com%20o%20oficial." target="_blank" rel="noopener noreferrer">💬 Falar com o oficial</a>
    </div>

    <form id="todo-form" class="todo-form"><input id="todo-input" type="text" placeholder="Adicionar nova tarefa..." maxlength="120" autocomplete="off"><button type="submit">Adicionar</button></form>
    <div class="toolbar"><div class="filters"><button type="button" class="filter-btn active" data-filter="all">Todas</button><button type="button" class="filter-btn" data-filter="active">Pendentes</button><button type="button" class="filter-btn" data-filter="completed">Concluídas</button></div><button type="button" id="clear-completed" class="clear-btn">Limpar concluídas</button></div>
    <div class="stats"><span id="tasks-counter">0 tarefas</span></div><ul id="todo-list" class="todo-list"></ul><p id="empty-message" class="empty-message hidden">Nenhuma tarefa por enquanto.</p>
  </main>
  <script>
    const KEY='todo-list-items',form=document.getElementById('todo-form'),input=document.getElementById('todo-input'),list=document.getElementById('todo-list'),empty=document.getElementById('empty-message'),counter=document.getElementById('tasks-counter');
    let tasks=load(),filter='all';
    function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}
    function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
    function visible(){return filter==='active'?tasks.filter(t=>!t.completed):filter==='completed'?tasks.filter(t=>t.completed):tasks}
    function render(){list.innerHTML='';const shown=visible();empty.classList.toggle('hidden',shown.length>0);shown.forEach(t=>{const item=document.createElement('li');item.className='task-item '+(t.completed?'completed':'');const main=document.createElement('div');main.className='task-main';const check=document.createElement('input');check.type='checkbox';check.checked=t.completed;check.className='task-checkbox';check.onchange=()=>toggle(t.id);const text=document.createElement('span');text.className='task-text';text.textContent=t.text;main.append(check,text);const actions=document.createElement('div');actions.className='task-actions';const edit=document.createElement('button');edit.type='button';edit.className='edit-btn';edit.textContent='Editar';edit.onclick=()=>editTask(t.id);const del=document.createElement('button');del.type='button';del.className='delete-btn';del.textContent='Excluir';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};actions.append(edit,del);item.append(main,actions);list.appendChild(item)});const total=tasks.length,done=tasks.filter(t=>t.completed).length;counter.textContent=total===0?'0 tarefas':filter==='completed'?`${done} concluídas`:filter==='active'?`${total-done} pendentes`:`${total} tarefas`}
    function toggle(id){tasks=tasks.map(t=>t.id===id?{...t,completed:!t.completed}:t);save();render()}
    function editTask(id){const t=tasks.find(x=>x.id===id),value=prompt('Editar tarefa:',t.text);if(value===null)return;const text=value.trim();if(!text)return alert('A tarefa não pode ficar vazia.');tasks=tasks.map(x=>x.id===id?{...x,text}:x);save();render()}
    form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return input.focus();tasks.unshift({id:Date.now(),text,completed:false});save();input.value='';render();input.focus()};
    document.querySelectorAll('.filter-btn').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b===btn));render()});
    document.getElementById('clear-completed').onclick=()=>{tasks=tasks.filter(t=>!t.completed);save();render()};render();
  </script>
</body>
</html>
