<!DOCTYPE html>
<html lang="pt"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANTANA DRIPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f6f6f6}
header{background:#000;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
#cartBtn{background:#fff;color:#000;border:0;padding:8px 14px;border-radius:20px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #0001}
.card img{width:100%;height:170px;object-fit:cover}
.info{padding:10px}.preco{font-weight:900;font-size:17px;margin:4px 0}
.btn{width:100%;padding:11px;border:0;border-radius:10px;font-weight:800;margin-top:6px}
.btn-buy{background:#000;color:#fff}.btn-cart{background:#eee;color:#000}
#modal,#cartModal{display:none;position:fixed;inset:0;background:#000a;z-index:99;align-items:center;justify-content:center;padding:16px;overflow:auto}
.box{background:#fff;width:100%;max-width:400px;border-radius:18px;padding:18px;text-align:center}
.copy{width:100%;padding:12px;border-radius:10px;border:0;margin:6px 0;font-weight:700}
.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}
</style>
</head><body>
<header><b>SANTANA DRIPS 🔥</b><button id="cartBtn" onclick="abrirCarrinho()">🛒 <span id="cartCount">0</span></button></header>
<div class="grid" id="produtos"></div>
<div id="modal" onclick="if(event.target==this)fechar()"><div class="box">
<h3 id="pNome"></h3>
<div style="background:#f2f2f2;padding:12px;border-radius:10px;margin:12px 0;text-align:left">
<b>M-Pesa:</b> <span id="mNum">-</span> <button onclick="copiar('m')" style="float:right">📋</button><br>
<b>e-Mola:</b> <span id="eNum">-</span> <button onclick="copiar('e')" style="float:right">📋</button>
</div>
<div style="text-align:left">
<h4>📍 Dados para Entrega</h4>
<input class="input" id="cliNome" placeholder="Seu nome completo">
<input class="input" id="cliBairro" placeholder="Bairro / Local ex: Zimpeto">
<input class="input" id="cliTel" placeholder="Seu número ex: 84...">
<select class="input" id="cliPagamento"><option>M-Pesa</option><option>e-Mola</option></select>
</div>
<button class="copy" style="background:#25D366;color:#fff" onclick="finalizar()">✅ CONFIRMAR E ENVIAR COMPROVATIVO</button>
<button onclick="fechar()" style="background:none;border:0;margin-top:10px">Cancelar</button>
</div></div>
<div id="cartModal" onclick="if(event.target==this)fecharCart()"><div class="box"><h3>Seu Carrinho</h3><div id="cartLista" style="text-align:left;margin:10px 0"></div><b>Total: <span id="cartTotal">0</span> MT</b><br><button class="copy" style="background:#000;color:#fff" onclick="pagarTudo()">PAGAR AGORA</button><button onclick="fecharCart()" style="background:none;border:0">Continuar comprando</button></div></div>

<footer style="background:#000;color:#aaa;padding:22px;text-align:center;margin-top:30px">
<div style="font-size:11px;line-height:1.7">
<b style="color:#fff;font-size:13px">SANTANA DRIPS</b><br>Loja Oficial - Maputo • Matola • Gaza<br><br>
<span style="font-size:8.5px;opacity:0.55;letter-spacing:0.4px">
App criado por <a href="criador.html" style="color:#aaa;text-decoration:underline">Mr James Chihanane de Gaza</a><br>
Contacto criador: +27 73 123 3343<br>
© 2026 Santana Drips - Todos direitos reservados
</span><br><br>
<a href="criador.html" style="font-size:10px;color:#666;text-decoration:none;border:1px solid #333;padding:6px 12px;border-radius:20px">👨‍💻 Ver Criador do App</a>
</div>
</footer>

<script>
const def=[{nome:'Tenis Nike Air',preco:1650,foto:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500'},{nome:'Drip Completo',preco:2500,foto:'https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=500'}];
let carrinho=JSON.parse(localStorage.getItem('santana_cart')||'[]');let atual=null;
function getP(){let p=JSON.parse(localStorage.getItem('santana_prods')||'null');return p&&p.length?p:def}
function render(){document.getElementById('produtos').innerHTML=getP().map((p,i)=>`<div class="card"><img src="${p.foto}"><div class="info"><div>${p.nome}</div><div class="preco">${p.preco} MT</div><button class="btn btn-buy" onclick="comprar(${i})">COMPRAR</button><button class="btn btn-cart" onclick="addCart(${i})">+ Carrinho</button></div></div>`).join('');document.getElementById('mNum').innerText=localStorage.getItem('mpesa')||'Configura no ADMIN';document.getElementById('eNum').innerText=localStorage.getItem('emola')||'Configura no ADMIN';updateCart()}
function comprar(i){atual=getP()[i];document.getElementById('pNome').innerText=atual.nome+' - '+atual.preco+' MT';document.getElementById('modal').style.display='flex'}
function fechar(){document.getElementById('modal').style.display='none'}
function addCart(i){carrinho.push(getP()[i]);localStorage.setItem('santana_cart',JSON.stringify(carrinho));updateCart();alert('Adicionado! 🛒')}
function updateCart(){document.getElementById('cartCount').innerText=carrinho.length;document.getElementById('cartLista').innerHTML=carrinho.map((p,i)=>`${p.nome} - ${p.preco}MT <button onclick="rem(${i})" style="float:right">x</button><br>`).join('')||'Vazio';let
